<!DOCTYPE html>
<html lang="be">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Віктар Морхат - Вершы</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="season-summer">
    <!-- Background Canvas for dynamic particles -->
    <canvas id="particles-canvas" class="particles-bg"></canvas>
    
    <!-- Background Overlay for dynamic gradients -->
    <div id="bg-overlay" class="bg-overlay"></div>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <h1>Віктар Морхат</h1>
                <p>Пары года (Эксперымент)</p>
            </header>
            
            <nav class="poem-nav">
                <ul class="nav-list" id="poem-list">
                    <!-- Nav items will be generated by JS -->
                </ul>
            </nav>
            
            <div class="season-indicator">
                <span id="current-season-icon">☀️</span>
                <span id="current-season-text">Лета</span>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <article class="poem-card">
                <header class="poem-header">
                    <h2 class="poem-title" id="poem-title"></h2>
                    <h3 class="poem-subtitle" id="poem-subtitle"></h3>
                </header>
                
                <div class="poem-body" id="poem-body">
                    <!-- Poem content will be injected by JS -->
                </div>
                
                <footer class="poem-footer" id="poem-footer">
                    <time id="poem-date"></time>
                </footer>
            </article>
        </main>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
