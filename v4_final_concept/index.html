<!DOCTYPE html>
<html lang="be">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Віктар Морхат - Вершы</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-night">
    <!-- Background Canvas for dynamic particles -->
    <canvas id="particles-canvas" class="particles-bg"></canvas>
    
    <!-- Background Overlay for dynamic gradients -->
    <div id="bg-overlay" class="bg-overlay"></div>

    <!-- Mobile Header -->
    <header class="mobile-header">
        <button id="menu-toggle" class="menu-toggle" aria-label="Адкрыць меню">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <h1 class="mobile-title">Віктар Морхат</h1>
    </header>

    <!-- Mobile Overlay -->
    <div id="mobile-overlay" class="mobile-overlay"></div>

    <div class="layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <header class="sidebar-header">
                <h1>Віктар Морхат</h1>
                <p>Паэтычны архіў</p>
                
                <button id="theme-toggle" class="theme-toggle" aria-label="Пераключыць тэму">
                    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </header>
            
            <nav class="poem-nav">
                <ul class="nav-list" id="poem-list">
                    <!-- Nav items will be generated by JS -->
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <article class="poem-card" id="poem-wrapper">
                <header class="poem-header">
                    <h2 class="poem-title" id="poem-title"></h2>
                    <h3 class="poem-subtitle" id="poem-subtitle"></h3>
                    <div class="poem-epigraph" id="poem-epigraph"></div>
                </header>
                
                <div class="poem-body" id="poem-body">
                    <!-- Poem content will be injected by JS -->
                </div>
                <div class="poem-date" id="poem-date"></div>
                <div class="poem-footnotes" id="poem-footnotes"></div>
            </article>
        </main>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
